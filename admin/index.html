<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - The Horseman's Journal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #060308 0%, #0a0815 100%);
      font-family: 'Cinzel', serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: linear-gradient(145deg, #1a1528, #0f0c1a);
      border: 1px solid rgba(232,200,74,0.3);
      border-radius: 20px;
      padding: 3rem;
      width: 380px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .login-container h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.5rem;
      color: #E8C84A;
      margin-bottom: 0.5rem;
    }
    .login-container p {
      font-size: 0.75rem;
      color: rgba(240,230,200,0.4);
      margin-bottom: 2rem;
      font-family: 'EB Garamond', serif;
    }
    .login-container input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      background: rgba(20,15,35,0.8);
      border: 1px solid rgba(232,200,74,0.2);
      border-radius: 10px;
      color: #fff;
      font-family: 'EB Garamond', serif;
      font-size: 1rem;
    }
    .login-container input:focus {
      outline: none;
      border-color: rgba(232,200,74,0.6);
    }
    .login-container button {
      width: 100%;
      padding: 14px;
      background: #E8C84A;
      border: none;
      border-radius: 10px;
      font-family: 'Cinzel', serif;
      font-weight: bold;
      font-size: 0.8rem;
      letter-spacing: 2px;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.3s;
    }
    .login-container button:hover {
      background: #f0d860;
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(232,200,74,0.3);
    }
    .error { color: #ff8888; margin-top: 15px; font-size: 0.75rem; display: none; }
    .lock-icon { font-size: 3rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="lock-icon">🔒</div>
    <h1>The Horseman's Journal</h1>
    <p>Content Management System</p>
    <input type="password" id="adminPassword" placeholder="Enter Admin Password">
    <button onclick="login()">ACCESS PORTAL ✦</button>
    <div class="error" id="errorMsg">Incorrect password. Please try again.</div>
  </div>
  <script>
    // CHANGE THIS PASSWORD TO YOUR OWN
    const CORRECT_PASSWORD = "Horseman2024";
    
    function login() {
      const pwd = document.getElementById('adminPassword').value;
      if (pwd === CORRECT_PASSWORD) {
        localStorage.setItem('adminAuth', 'true');
        localStorage.setItem('adminExpires', Date.now() + (8 * 60 * 60 * 1000));
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    }
  </script>
</body>
</html>
