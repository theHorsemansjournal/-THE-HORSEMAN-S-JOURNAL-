<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Content Manager - The Horseman's Journal CMS</title>
  <meta name="description" content="Content Management System for The Horseman's Journal">
  <meta name="robots" content="noindex, nofollow">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060308;
      font-family: 'EB Garamond', serif;
      color: #e8dfc7;
      position: relative;
    }

    /* ===== WATERMARK (logo.jpg) ===== */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('logo.jpg');
      background-repeat: repeat;
      background-size: 180px;
      opacity: 0.035;
      pointer-events: none;
      z-index: 0;
    }

    /* ===== FAVICON ANIMATION CANVAS ===== */
    #faviconCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.2;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 260px;
      height: 100vh;
      background: linear-gradient(180deg, #0f0c1a, #080614);
      border-right: 1px solid rgba(232,200,74,0.15);
      padding: 2rem 0;
      overflow-y: auto;
      z-index: 100;
    }
    .sidebar-logo {
      text-align: center;
      padding: 0 1rem 2rem;
      border-bottom: 1px solid rgba(232,200,74,0.1);
      margin-bottom: 2rem;
    }
    .sidebar-logo h2 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1rem;
      color: #E8C84A;
      letter-spacing: 2px;
    }
    .sidebar-logo p {
      font-size: 0.65rem;
      color: rgba(240,230,200,0.3);
      margin-top: 5px;
    }
    .back-to-site {
      display: block;
      text-align: center;
      margin: 1rem 1rem;
      padding: 8px;
      background: rgba(232,200,74,0.08);
      border: 1px solid rgba(232,200,74,0.2);
      border-radius: 30px;
      color: rgba(232,200,74,0.6);
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 2px;
      transition: all 0.3s;
    }
    .back-to-site:hover {
      background: rgba(232,200,74,0.15);
      color: #E8C84A;
    }
    .nav-item {
      padding: 12px 24px;
      margin: 4px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: rgba(240,230,200,0.5);
    }
    .nav-item:hover {
      background: rgba(232,200,74,0.1);
      color: #E8C84A;
    }
    .nav-item.active {
      background: rgba(232,200,74,0.15);
      color: #E8C84A;
      border-left: 2px solid #E8C84A;
    }
    .main-content {
      margin-left: 260px;
      padding: 2rem;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(232,200,74,0.1);
      flex-wrap: wrap;
      gap: 1rem;
    }
    .top-bar h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.3rem;
      color: #E8C84A;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid rgba(232,200,74,0.3);
      padding: 8px 20px;
      border-radius: 30px;
      color: #e8dfc7;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      transition: all 0.3s;
    }
    .logout-btn:hover {
      background: rgba(232,200,74,0.1);
      border-color: #E8C84A;
    }
    .editor-card {
      background: linear-gradient(145deg, #1a1528, #0f0c1a);
      border: 1px solid rgba(232,200,74,0.15);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(2px);
    }
    .editor-card h3 {
      font-family: 'Cinzel', serif;
      color: #E8C84A;
      margin-bottom: 1.5rem;
      font-size: 1rem;
      letter-spacing: 2px;
    }
    label {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: rgba(232,200,74,0.5);
      margin-top: 1.2rem;
      margin-bottom: 0.5rem;
      font-family: 'Cinzel', serif;
    }
    input, textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(20,15,35,0.6);
      border: 1px solid rgba(232,200,74,0.2);
      border-radius: 10px;
      color: #e8dfc7;
      font-family: 'EB Garamond', serif;
      font-size: 0.95rem;
      transition: all 0.3s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: rgba(232,200,74,0.5);
    }
    textarea {
      min-height: 250px;
      line-height: 1.6;
    }
    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    .save-btn {
      background: #E8C84A;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-family: 'Cinzel', serif;
      font-weight: bold;
      font-size: 0.7rem;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .save-btn:hover {
      background: #f0d860;
      transform: translateY(-2px);
    }
    .status-msg {
      margin-top: 1rem;
      font-size: 0.8rem;
      font-style: italic;
      color: rgba(232,200,74,0.5);
    }
    .article-item {
      background: rgba(20,15,35,0.3);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .article-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .article-header span {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      color: rgba(232,200,74,0.6);
    }

    /* ===== COOKIE CONSENT ===== */
    .cookie-consent {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(8,6,20,0.92);
      backdrop-filter: blur(12px);
      padding: 0.8rem;
      text-align: center;
      z-index: 1000;
      font-size: 0.75rem;
      transform: translateY(100%);
      transition: transform 0.3s;
      border-top: 1px solid rgba(212,175,55,0.15);
    }
    .cookie-consent.show { transform: translateY(0); }
    .cookie-consent button {
      background: #D4AF37;
      border: none;
      padding: 0.2rem 1rem;
      margin-left: 0.5rem;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
    }
    .cookie-consent .decline-btn {
      background: transparent;
      border: 1px solid rgba(212,175,55,0.5);
      color: #D4AF37;
    }
    
    @media (max-width: 768px) {
      .sidebar { width: 200px; }
      .main-content { margin-left: 200px; padding: 1rem; }
      .nav-item { padding: 8px 16px; font-size: 0.6rem; }
      .editor-card { padding: 1.2rem; }
    }
    @media (max-width: 560px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.3s; z-index: 100; }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .menu-toggle {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 101;
        background: rgba(232,200,74,0.2);
        border: 1px solid rgba(232,200,74,0.3);
        border-radius: 8px;
        padding: 8px 12px;
        color: #E8C84A;
        cursor: pointer;
        font-family: 'Cinzel', serif;
        font-size: 0.7rem;
        display: block;
      }
    }
  </style>
</head>
<body>
  <button class="menu-toggle" id="menuToggle" style="display:none;">☰ MENU</button>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <h2>📖 THE HORSEMAN'S<br>JOURNAL</h2>
      <p>Content Management</p>
    </div>
    <a href="index.html" class="back-to-site">← BACK TO SITE</a>
    <div class="nav-item active" data-section="book">📚 BOOK SETTINGS</div>
    <div class="nav-item" data-section="about">📜 ABOUT</div>
    <div class="nav-item" data-section="awakening">🌅 AWAKENING</div>
    <div class="nav-item" data-section="chronicles">📖 CHRONICLES</div>
    <div class="nav-item" data-section="companions">🐴 COMPANIONS</div>
    <div class="nav-item" data-section="essays">✍️ VERSES</div>
    <div class="nav-item" data-section="questions">❓ QUESTIONS</div>
    <div class="nav-item" data-section="gathering">🤝 GATHERING</div>
    <div class="nav-item" data-section="bookpage">📘 THE BOOK</div>
  </div>

  <div class="main-content">
    <div class="top-bar">
      <h1 id="pageTitle">Book Settings</h1>
      <button class="logout-btn" onclick="logout()" type="button">LOGOUT ✦</button>
    </div>
    <div id="editorContainer"></div>
  </div>

  <div id="cookieConsent" class="cookie-consent">
    <span>🍪 This website uses cookies to improve your experience.</span>
    <button id="acceptCookies" type="button">Accept</button>
    <button id="declineCookies" type="button" class="decline-btn">Decline</button>
  </div>

  <script>
    // ============================================
    // AUTHENTICATION CHECK (redirects to admin-login.html)
    // ============================================
    const authExpiry = localStorage.getItem('adminExpires');
    if (localStorage.getItem('adminAuth') !== 'true' || (authExpiry && Date.now() > parseInt(authExpiry))) {
      localStorage.removeItem('adminAuth');
      localStorage.removeItem('adminExpires');
      window.location.href = 'admin-login.html';
    }

    let currentSection = 'book';
    let contentData = {};

    const defaultContent = {
      book: {
        title: "THE HORSEMAN'S JOURNAL",
        subtitle: "A CONVERSATION IN SILENCE",
        author: "PRAVEEN KUMAR",
        price: "10.99",
        edition: "First Edition",
        year: "2024",
        pages: "400",
        description: "Eleven years. Fifteen truths. Written in dust, silence, and the breath of horses. This book is not a training manual. It is a conversation — about trust, about fear, about the invisible bond between horse and human.",
        aboutAuthor: "Praveen Kumar has spent eleven years working with horses across India. His approach prioritizes understanding over control, trust over obedience, and presence over technique."
      },
      about: { title: "About The Horseman", content: "Meet Praveen Kumar. Eleven years of horsemanship, one black stallion, and a philosophy built on trust, not force." },
      awakening: { title: "Awakening", content: "The black stallion story..." },
      chronicles: { title: "Chronicles", articles: [] },
      companions: { title: "Companions", content: "The horses who shaped me..." },
      essays: { title: "Verses", content: "Poetry and essays..." },
      questions: { title: "Questions", content: "Q&A section..." },
      gathering: { title: "The Gathering", content: "Share your story..." },
      bookpage: { title: "The Book", content: "Book information and purchase options..." }
    };

    function loadContent() {
      const saved = localStorage.getItem('journalContent');
      if (saved) {
        contentData = JSON.parse(saved);
      } else {
        contentData = defaultContent;
      }
      renderEditor();
    }

    function saveContent() {
      localStorage.setItem('journalContent', JSON.stringify(contentData));
      showStatus('Content saved successfully!');
    }

    function showStatus(msg) {
      const statusDiv = document.getElementById('statusMsg');
      if (statusDiv) {
        statusDiv.textContent = msg;
        setTimeout(() => { if(statusDiv) statusDiv.textContent = ''; }, 2000);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    function renderEditor() {
      const container = document.getElementById('editorContainer');
      const data = contentData[currentSection];
      
      if (currentSection === 'book') {
        container.innerHTML = `
          <div class="editor-card">
            <h3>📖 Book Information</h3>
            <label>Book Title</label>
            <input type="text" id="bookTitle" value="${escapeHtml(data.title)}">
            <label>Subtitle</label>
            <input type="text" id="bookSubtitle" value="${escapeHtml(data.subtitle)}">
            <label>Author Name</label>
            <input type="text" id="bookAuthor" value="${escapeHtml(data.author)}">
            <label>Price (USD)</label>
            <input type="text" id="bookPrice" value="${escapeHtml(data.price)}">
            <label>Edition</label>
            <input type="text" id="bookEdition" value="${escapeHtml(data.edition)}">
            <label>Year</label>
            <input type="text" id="bookYear" value="${escapeHtml(data.year)}">
            <label>Pages</label>
            <input type="text" id="bookPages" value="${escapeHtml(data.pages)}">
            <label>Book Description</label>
            <textarea id="bookDescription">${escapeHtml(data.description)}</textarea>
            <label>About the Author</label>
            <textarea id="bookAboutAuthor">${escapeHtml(data.aboutAuthor)}</textarea>
            <div class="button-group">
              <button class="save-btn" onclick="saveBookData()" type="button">SAVE BOOK INFO</button>
            </div>
            <div id="statusMsg" class="status-msg"></div>
          </div>
        `;
      } else if (currentSection === 'chronicles') {
        container.innerHTML = `
          <div class="editor-card">
            <h3>📖 Chronicles (15 Articles)</h3>
            <div id="chroniclesArticles"></div>
            <div class="button-group">
              <button class="save-btn" onclick="saveChroniclesData()" type="button">SAVE ALL ARTICLES</button>
            </div>
            <div id="statusMsg" class="status-msg"></div>
          </div>
        `;
        const articlesContainer = document.getElementById('chroniclesArticles');
        const articles = data.articles || [];
        for (let i = 0; i < 15; i++) {
          const article = articles[i] || { title: `Article ${i+1}`, content: '' };
          articlesContainer.innerHTML += `
            <div class="article-item">
              <div class="article-header">
                <span>Article ${String(i+1).padStart(2,'0')}</span>
              </div>
              <label>Title</label>
              <input type="text" id="art_title_${i}" value="${escapeHtml(article.title)}">
              <label>Content (HTML allowed)</label>
              <textarea id="art_content_${i}" rows="8">${escapeHtml(article.content)}</textarea>
            </div>
          `;
        }
      } else {
        container.innerHTML = `
          <div class="editor-card">
            <h3>${currentSection.toUpperCase()}</h3>
            <label>Page Title</label>
            <input type="text" id="pageTitle" value="${escapeHtml(data.title)}">
            <label>Content (HTML allowed)</label>
            <textarea id="pageContent" rows="12">${escapeHtml(data.content)}</textarea>
            <div class="button-group">
              <button class="save-btn" onclick="savePageData()" type="button">SAVE CHANGES</button>
            </div>
            <div id="statusMsg" class="status-msg"></div>
          </div>
        `;
      }
    }

    function saveBookData() {
      contentData.book = {
        title: document.getElementById('bookTitle').value,
        subtitle: document.getElementById('bookSubtitle').value,
        author: document.getElementById('bookAuthor').value,
        price: document.getElementById('bookPrice').value,
        edition: document.getElementById('bookEdition').value,
        year: document.getElementById('bookYear').value,
        pages: document.getElementById('bookPages').value,
        description: document.getElementById('bookDescription').value,
        aboutAuthor: document.getElementById('bookAboutAuthor').value
      };
      saveContent();
    }

    function savePageData() {
      contentData[currentSection] = {
        title: document.getElementById('pageTitle').value,
        content: document.getElementById('pageContent').value
      };
      saveContent();
    }

    function saveChroniclesData() {
      const articles = [];
      for (let i = 0; i < 15; i++) {
        articles.push({
          title: document.getElementById(`art_title_${i}`).value,
          content: document.getElementById(`art_content_${i}`).value
        });
      }
      contentData.chronicles = { title: "Chronicles", articles: articles };
      saveContent();
    }

    function logout() {
      localStorage.removeItem('adminAuth');
      localStorage.removeItem('adminExpires');
      localStorage.removeItem('journalContent');
      window.location.href = 'admin-login.html';
    }

    // Navigation
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        item.classList.add('active');
        currentSection = item.dataset.section;
        const titleMap = {
          book: 'Book Settings',
          about: 'About Page',
          awakening: 'Awakening',
          chronicles: 'Chronicles (15 Articles)',
          companions: 'Companions',
          essays: 'Verses',
          questions: 'Questions',
          gathering: 'The Gathering',
          bookpage: 'The Book Page'
        };
        document.getElementById('pageTitle').innerHTML = titleMap[currentSection] || currentSection.toUpperCase();
        renderEditor();
      });
    });

    // Mobile menu toggle
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    if (window.innerWidth <= 560) {
      menuToggle.style.display = 'block';
      menuToggle.addEventListener('click', () => {
        sidebar.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        if (!sidebar.contains(e.target) && e.target !== menuToggle && sidebar.classList.contains('open')) {
          sidebar.classList.remove('open');
        }
      });
    }

    // ============================================
    // UNIFIED COOKIE CONSENT (same as other pages)
    // ============================================
    const cookieConsent = document.getElementById('cookieConsent');
    const acceptCookies = document.getElementById('acceptCookies');
    const declineCookies = document.getElementById('declineCookies');
    
    function setCookieConsent(accepted) {
      localStorage.setItem('cookieConsent', accepted ? 'accepted' : 'declined');
      if (cookieConsent) cookieConsent.classList.remove('show');
    }
    
    function showCookieConsent() {
      if (!cookieConsent) return;
      const consent = localStorage.getItem('cookieConsent');
      if (!consent) {
        cookieConsent.classList.add('show');
      } else {
        cookieConsent.classList.remove('show');
      }
    }
    
    if (acceptCookies) acceptCookies.addEventListener('click', () => setCookieConsent(true));
    if (declineCookies) declineCookies.addEventListener('click', () => setCookieConsent(false));
    showCookieConsent();

    // ============================================
    // FAVICON PARTICLE ANIMATION (floating favicon.png)
    // ============================================
    const faviconCanvas = document.createElement('canvas');
    faviconCanvas.id = 'faviconCanvas';
    faviconCanvas.style.position = 'fixed';
    faviconCanvas.style.top = '0';
    faviconCanvas.style.left = '0';
    faviconCanvas.style.width = '100%';
    faviconCanvas.style.height = '100%';
    faviconCanvas.style.pointerEvents = 'none';
    faviconCanvas.style.zIndex = '0';
    faviconCanvas.style.opacity = '0.2';
    document.body.appendChild(faviconCanvas);
    
    const favCtx = faviconCanvas.getContext('2d');
    let favW, favH;
    let favParticles = [];
    const faviconImg = new Image();
    faviconImg.src = 'favicon.png';
    
    function resizeFavCanvas() {
      favW = faviconCanvas.width = window.innerWidth;
      favH = faviconCanvas.height = window.innerHeight;
    }
    
    class FavParticle {
      constructor() {
        this.x = Math.random() * favW;
        this.y = Math.random() * favH;
        this.size = Math.random() * 20 + 10;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = (Math.random() - 0.5) * 0.2 + 0.1;
        this.alpha = Math.random() * 0.4 + 0.1;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.01;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.rotation += this.rotSpeed;
        if (this.x < -50) this.x = favW + 50;
        if (this.x > favW + 50) this.x = -50;
        if (this.y < -50) this.y = favH + 50;
        if (this.y > favH + 50) this.y = -50;
      }
      draw() {
        if (!faviconImg.complete) return;
        favCtx.save();
        favCtx.translate(this.x, this.y);
        favCtx.rotate(this.rotation);
        favCtx.globalAlpha = this.alpha;
        favCtx.drawImage(faviconImg, -this.size/2, -this.size/2, this.size, this.size);
        favCtx.restore();
      }
    }
    
    function initFavParticles() {
      favParticles = [];
      for (let i = 0; i < 40; i++) {
        favParticles.push(new FavParticle());
      }
    }
    
    function animateFav() {
      if (!favCtx) return;
      favCtx.clearRect(0, 0, favW, favH);
      favParticles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateFav);
    }
    
    if (faviconImg.complete) {
      resizeFavCanvas();
      initFavParticles();
      animateFav();
    } else {
      faviconImg.onload = () => {
        resizeFavCanvas();
        initFavParticles();
        animateFav();
      };
    }
    
    window.addEventListener('resize', () => {
      resizeFavCanvas();
      initFavParticles();
    });

    loadContent();
  </script>
</body>
</html>
