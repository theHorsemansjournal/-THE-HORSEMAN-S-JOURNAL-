<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Horseman's Journal | The Book</title>
  <link rel="stylesheet" href="global.css">
  <style>
    body { margin: 0; overflow-x: hidden; background: #05080d; color: white; }
    canvas { display: block; width: 100%; height: 100vh; cursor: grab; }
    #info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #D4AF37;
      font-family: monospace;
      z-index: 10;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 8px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="bookCanvas"></canvas>
  <div id="info">Drag to rotate | Red cube = test object</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // Setup
    const canvas = document.getElementById('bookCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x05080d, 1);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 5);
    camera.lookAt(0, 0, 0);

    // Bright ambient + directional light
    const ambient = new THREE.AmbientLight(0x404060);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(2, 3, 4);
    scene.add(dirLight);
    const backLight = new THREE.DirectionalLight(0x88aacc, 0.8);
    backLight.position.set(-1, 1, -2);
    scene.add(backLight);

    // --- TEST CUBE (to verify rendering works) ---
    const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
    const cubeMat = new THREE.MeshStandardMaterial({ color: 0xff3366 });
    const cube = new THREE.Mesh(cubeGeo, cubeMat);
    cube.position.set(0, 0, 0);
    scene.add(cube);
    console.log("Cube added at origin");

    // --- Create a simple book representation (two boxes) ---
    const bookGroup = new THREE.Group();
    const coverMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.3, metalness: 0.1 });
    const pagesMat = new THREE.MeshStandardMaterial({ color: 0xeeddcc, roughness: 0.7 });
    
    const backCover = new THREE.Mesh(new THREE.BoxGeometry(2.5, 3.8, 0.1), coverMat);
    backCover.position.set(0, 0, -0.05);
    bookGroup.add(backCover);
    
    const pages = new THREE.Mesh(new THREE.BoxGeometry(2.4, 3.7, 0.25), pagesMat);
    pages.position.set(0, 0, 0);
    bookGroup.add(pages);
    
    const frontCover = new THREE.Mesh(new THREE.BoxGeometry(2.5, 3.8, 0.1), coverMat);
    frontCover.position.set(0, 0, 0.15);
    bookGroup.add(frontCover);
    
    // Spine
    const spine = new THREE.Mesh(new THREE.BoxGeometry(0.25, 3.8, 0.4), new THREE.MeshStandardMaterial({ color: 0x5a3a1a }));
    spine.position.set(-1.25, 0, 0);
    bookGroup.add(spine);
    
    scene.add(bookGroup);
    
    // Slight rotation for better view
    bookGroup.rotation.y = 0.3;
    bookGroup.rotation.x = 0.1;
    cube.rotation.y = 0.3;
    cube.rotation.x = 0.1;

    // --- Interaction: drag to rotate both cube and book ---
    let isDragging = false;
    let lastX = 0;
    let targetRotY = 0.3;
    let currentRotY = 0.3;
    let targetRotX = 0.1;
    let currentRotX = 0.1;
    
    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.style.cursor = 'grabbing';
    });
    let lastY = 0;
    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - lastX;
      const deltaY = e.clientY - lastY;
      targetRotY += deltaX * 0.01;
      targetRotX += deltaY * 0.01;
      targetRotX = Math.max(-0.8, Math.min(0.8, targetRotX));
      lastX = e.clientX;
      lastY = e.clientY;
    });
    window.addEventListener('pointerup', () => {
      isDragging = false;
      canvas.style.cursor = 'grab';
    });
    
    function animate() {
      requestAnimationFrame(animate);
      currentRotY += (targetRotY - currentRotY) * 0.1;
      currentRotX += (targetRotX - currentRotX) * 0.1;
      bookGroup.rotation.y = currentRotY;
      bookGroup.rotation.x = currentRotX;
      cube.rotation.y = currentRotY;
      cube.rotation.x = currentRotX;
      renderer.render(scene, camera);
    }
    animate();
    
    // Handle resize
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });
    
    console.log("Three.js version:", THREE.REVISION);
  </script>
</body>
</html>
